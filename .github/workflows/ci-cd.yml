name: CI/CD Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: |
          for f in "Quiz App Master"/*.js; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Validate questions.json
        run: node -e "JSON.parse(require('fs').readFileSync('Quiz App Master/questions.json','utf8')); console.log('questions.json is valid')"

      - name: Lint HTML
        run: npx --yes htmlhint "Quiz App Master/*.html"

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: "Quiz App Master"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
